name: Proves de navegador a petició

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/run-e2e')
    runs-on: ubuntu-latest
    steps:
      - name: Comprova permisos i obté el commit de la PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission)) {
              core.setFailed('Només una persona amb permisos d’escriptura pot iniciar aquestes proves.');
              return;
            }
            core.setOutput('ref', `refs/pull/${context.issue.number}/head`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
